<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stickman PvP Arena Mobile & PC</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a0f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #12141d;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .interactive { pointer-events: auto; }

    /* MENU LOBBY */
    #menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 10, 15, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 15px;
      overflow-y: auto;
      backdrop-filter: blur(8px);
      z-index: 20;
    }

    .app-title {
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 900;
      color: #7f5af0;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-shadow: 0 0 15px rgba(127, 90, 240, 0.5);
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 950px;
    }

    .card {
      background: #161822;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #2b2e3e;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card h3 {
      color: #2cb67d;
      font-size: 16px;
      border-bottom: 1px solid #2b2e3e;
      padding-bottom: 6px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      outline: none;
    }

    input, select {
      background: #0d0e14;
      color: #fff;
      border: 1px solid #2b2e3e;
    }

    button {
      background: #7f5af0;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s;
      text-transform: uppercase;
    }

    button:active { transform: scale(0.96); }
    .btn-green { background: #2cb67d; }
    .btn-orange { background: #ff8e3c; }

    /* HUD IN GAME */
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-weight: 800;
      font-size: 14px;
    }

    .hud-box {
      background: rgba(22, 24, 34, 0.85);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #2b2e3e;
    }

    .coin-val { color: #ffd700; }

    /* KONTROL SENTUH HP */
    #touch-controls {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 15;
      display: none;
    }

    .dpad {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 130px;
      height: 130px;
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
    }

    .dbtn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      color: #fff;
    }

    .dbtn:active { background: rgba(127, 90, 240, 0.8); }

    .action-btns {
      position: absolute;
      bottom: 30px;
      right: 25px;
      display: flex;
      gap: 15px;
      pointer-events: auto;
    }

    .act-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      font-size: 11px;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #btn-atk { background: rgba(255, 84, 112, 0.85); }
    #btn-atk:active { background: rgba(255, 84, 112, 1); }
    #btn-skl { background: rgba(127, 90, 240, 0.85); }
    #btn-skl:active { background: rgba(127, 90, 240, 1); }

    .code-box {
      font-size: 24px;
      font-weight: 900;
      color: #ffd700;
      text-align: center;
      background: #0d0e14;
      padding: 6px;
      border-radius: 6px;
      border: 1px dashed #ffd700;
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="ui-layer">
    <div id="hud">
      <div class="hud-box">Koin: <span id="hud-coins" class="coin-val">0</span> 💰</div>
      <div class="hud-box">Mode: <span id="hud-mode" style="color:#2cb67d;">Lobby</span></div>
    </div>

    <!-- TOUCH CONTROLS -->
    <div id="touch-controls">
      <div class="dpad">
        <div></div><div class="dbtn" id="d-up">▲</div><div></div>
        <div class="dbtn" id="d-left">◄</div><div></div><div class="dbtn" id="d-right">►</div>
        <div></div><div class="dbtn" id="d-down">▼</div><div></div>
      </div>
      <div class="action-btns">
        <div class="act-btn" id="btn-atk">ATTACK</div>
        <div class="act-btn" id="btn-skl">SKILL</div>
      </div>
    </div>

    <!-- MENU UTAMA -->
    <div id="menu-overlay" class="interactive">
      <div class="app-title">Stickman Arena</div>

      <div class="dashboard">
        <!-- 1. MODE MAIN -->
        <div class="card">
          <h3>1. MODE PERMAINAN</h3>
          <button class="btn-green" onclick="startSolo()">LATIHAN SOLO (BOT)</button>
          <hr style="border-color:#2b2e3e;">
          <button onclick="hostRoom()">BUAT ROOM (HOST 4 DIGIT)</button>
          <div id="host-code-display" style="display:none;">
            <div style="font-size:11px; color:#94a1b2;">Kode Room Anda:</div>
            <div id="room-code-val" class="code-box">0000</div>
          </div>
          <input type="number" id="input-code" placeholder="4 Digit Kode Room" maxlength="4">
          <button class="btn-orange" onclick="joinRoom()">GABUNG ROOM</button>
        </div>

        <!-- 2. GACHA -->
        <div class="card">
          <h3>2. GACHA SENJATA <span>100 💰</span></h3>
          <p>Koin Anda: <span id="menu-coins" class="coin-val">0</span> 💰</p>
          <button class="btn-orange" onclick="spinGacha()">SPIN GACHA</button>
          <div id="gacha-output" style="font-size:11px; color:#2cb67d; background:#0d0e14; padding:8px; border-radius:6px; min-height:35px;">
            Dapatkan senjata langka!
          </div>
        </div>

        <!-- 3. EQUIPMENT -->
        <div class="card">
          <h3>3. PERLENGKAPAN</h3>
          <label style="font-size:11px; color:#94a1b2;">Senjata:</label>
          <select id="sel-weapon" onchange="updateDesc()"></select>
          
          <label style="font-size:11px; color:#94a1b2;">Armor:</label>
          <select id="sel-armor" onchange="updateDesc()"></select>
          
          <label style="font-size:11px; color:#94a1b2;">Skill:</label>
          <select id="sel-skill" onchange="updateDesc()"></select>

          <div id="item-info" style="font-size:11px; color:#7f5af0; background:#0d0e14; padding:8px; border-radius:6px;">-</div>
          <button class="btn-green" onclick="enterArena()">MASUK ARENA</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // SOUND ENGINE
    class SoundEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      play(freq, type, duration) {
        this.init();
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
      }
      hit() { this.play(140, 'sawtooth', 0.1); }
      shoot() { this.play(400, 'square', 0.15); }
      skill() { this.play(600, 'sine', 0.25); }
      kill() { this.play(200, 'triangle', 0.4); }
    }
    const sound = new SoundEngine();

    // ITEM DATABASE
    const WEAPONS = {
      "Pedang": { name: "Pedang Kayu", type: "melee", dmg: 20, range: 50, cd: 300 },
      "Katana": { name: "Katana Iblis", type: "melee", dmg: 30, range: 65, cd: 200 },
      "Tombak": { name: "Tombak Panjang", type: "melee", dmg: 40, range: 90, cd: 500 },
      "Sihir": { name: "Tongkat Api", type: "ranged", dmg: 25, spd: 10, cd: 350 }
    };
    const ARMORS = {
      "Basic": { name: "Baju Kain", hp: 0, spd: 0 },
      "Besi": { name: "Armor Besi", hp: 50, spd: -0.4 },
      "Bayangan": { name: "Jubah Bayangan", hp: 20, spd: 1.5 }
    };
    const SKILLS = {
      "Dash": { name: "Sprint Dash", cd: 2000 },
      "Heal": { name: "Pulih Darah", cd: 5000 }
    };

    let inventory = { weapons: ["Pedang"], armors: ["Basic"], skills: ["Dash"] };
    let coins = 0;
    let roomCode = null, myPlayerId = 0, isHost = true, networkChannel = null;

    // CANVAS RESPONSIVE SETUP
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    let gameState = { players: {}, projectiles: [], particles: [] };
    let keys = {};

    // DETEKSI MOBILE
    const isMobile = ('ontouchstart' in window) || window.innerWidth < 800;
    if (isMobile) document.getElementById("touch-controls").style.display = "block";

    // KEYBOARD LISTENERS
    window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    // TOUCH LISTENERS
    function bindTouch(id, key) {
      let el = document.getElementById(id);
      el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[key] = true; });
      el.addEventListener("touchend", (e) => { e.preventDefault(); keys[key] = false; });
    }
    bindTouch("d-up", "w"); bindTouch("d-down", "s");
    bindTouch("d-left", "a"); bindTouch("d-right", "d");
    bindTouch("btn-atk", "j"); bindTouch("btn-skl", " ");

    function addCoins(amt) {
      coins += amt;
      document.getElementById("hud-coins").innerText = coins;
      document.getElementById("menu-coins").innerText = coins;
    }

    function spinGacha() {
      if (coins < 100) return alert("Koin kurang!");
      coins -= 100; addCoins(0);
      let itemKeys = ["Katana", "Tombak", "Sihir", "Besi", "Bayangan", "Heal"];
      let picked = itemKeys[Math.floor(Math.random() * itemKeys.length)];
      
      let cat = WEAPONS[picked] ? "weapons" : (ARMORS[picked] ? "armors" : "skills");
      if (!inventory[cat].includes(picked)) {
        inventory[cat].push(picked);
        document.getElementById("gacha-output").innerHTML = `<b style="color:#ffd700">Dapat: ${picked}!</b>`;
        updateLoadoutUI();
      } else {
        addCoins(50);
        document.getElementById("gacha-output").innerText = "Duplikat! Cashback +50 Koin.";
      }
    }

    function updateLoadoutUI() {
      const fillSel = (id, arr, obj) => {
        let el = document.getElementById(id); el.innerHTML = "";
        arr.forEach(k => {
          let opt = document.createElement("option"); opt.value = k; opt.innerText = obj[k].name;
          el.appendChild(opt);
        });
      };
      fillSel("sel-weapon", inventory.weapons, WEAPONS);
      fillSel("sel-armor", inventory.armors, ARMORS);
      fillSel("sel-skill", inventory.skills, SKILLS);
      updateDesc();
    }

    function updateDesc() {
      let w = WEAPONS[document.getElementById("sel-weapon").value];
      let a = ARMORS[document.getElementById("sel-armor").value];
      let s = SKILLS[document.getElementById("sel-skill").value];
      document.getElementById("item-info").innerText = `${w.name} | ${a.name} | ${s.name}`;
    }

    // MULTIPLAYER BROADCAST
    function hostRoom() {
      roomCode = Math.floor(1000 + Math.random() * 9000).toString();
      isHost = true; myPlayerId = 0;
      document.getElementById("host-code-display").style.display = "block";
      document.getElementById("room-code-val").innerText = roomCode;
      connectNet(roomCode);
    }

    function joinRoom() {
      let code = document.getElementById("input-code").value;
      if (code.length !== 4) return alert("Masukkan 4 Digit Kode!");
      roomCode = code; isHost = false; myPlayerId = Math.floor(Math.random() * 800) + 1;
      connectNet(roomCode);
      sendNet({ type: "JOIN", id: myPlayerId });
    }

    function connectNet(code) {
      if (networkChannel) networkChannel.close();
      networkChannel = new BroadcastChannel("pvp_" + code);
      networkChannel.onmessage = (e) => {
        let msg = e.data;
        if (isHost && msg.type === "INPUT") handleInput(msg.id, msg.keys);
        if (!isHost && msg.type === "SYNC") gameState = msg.state;
      };
    }

    function sendNet(obj) { if (networkChannel) networkChannel.postMessage(obj); }

    let inGame = false;
    function startSolo() {
      roomCode = "SOLO"; isHost = true; myPlayerId = 0;
      enterArena();
      // SPAWN BOT MUSUH
      gameState.players[99] = {
        id: 99, x: canvas.width - 100, y: canvas.height / 2,
        hp: 100, maxHp: 100, spd: 2, weaponKey: "Pedang", color: "#ff5470",
        dirX: -1, dirY: 0, animTick: 0, lastAtt: 0, skillCd: 0, isBot: true
      };
    }

    function enterArena() {
      document.getElementById("menu-overlay").style.display = "none";
      document.getElementById("hud-mode").innerText = roomCode || "Solo";
      inGame = true;

      let wKey = document.getElementById("sel-weapon").value;
      let aKey = document.getElementById("sel-armor").value;
      let sKey = document.getElementById("sel-skill").value;

      gameState.players[myPlayerId] = {
        id: myPlayerId, x: 100, y: canvas.height / 2,
        hp: 100 + ARMORS[aKey].hp, maxHp: 100 + ARMORS[aKey].hp,
        spd: 5 + ARMORS[aKey].spd, weaponKey: wKey, skillKey: sKey,
        color: "#2cb67d", dirX: 1, dirY: 0, animTick: 0,
        lastAtt: 0, skillCd: 0
      };

      startGameLoop();
    }

    function handleInput(id, pKeys) {
      let p = gameState.players[id];
      if (!p || p.hp <= 0) return;

      let dx = 0, dy = 0;
      if (pKeys["a"] || pKeys["arrowleft"]) dx -= 1;
      if (pKeys["d"] || pKeys["arrowright"]) dx += 1;
      if (pKeys["w"] || pKeys["arrowup"]) dy -= 1;
      if (pKeys["s"] || pKeys["arrowdown"]) dy += 1;

      if (dx !== 0 || dy !== 0) {
        p.x += dx * p.spd; p.y += dy * p.spd;
        p.dirX = dx; p.dirY = dy;
        p.animTick += 0.2; // animasi kaki berjalan
      }

      p.x = Math.max(30, Math.min(canvas.width - 30, p.x));
      p.y = Math.max(30, Math.min(canvas.height - 30, p.y));

      // SKILL
      if (pKeys[" "] && Date.now() > p.skillCd) {
        p.skillCd = Date.now() + SKILLS[p.skillKey].cd;
        sound.skill();
        if (p.skillKey === "Dash") { p.x += p.dirX * 100; p.y += p.dirY * 100; }
        if (p.skillKey === "Heal") { p.hp = Math.min(p.maxHp, p.hp + 40); }
      }

      // ATTACK
      if (pKeys["j"] && Date.now() > p.lastAtt) {
        let w = WEAPONS[p.weaponKey];
        p.lastAtt = Date.now() + w.cd;

        if (w.type === "melee") {
          sound.hit();
          for (let tid in gameState.players) {
            if (tid == id) continue;
            let target = gameState.players[tid];
            if (Math.hypot(p.x - target.x, p.y - target.y) <= w.range) {
              target.hp -= w.dmg;
              if (target.hp <= 0 && id == myPlayerId) addCoins(150);
            }
          }
        } else {
          sound.shoot();
          gameState.projectiles.push({
            ownerId: id, x: p.x, y: p.y,
            vx: p.dirX * w.spd, vy: p.dirY * w.spd,
            dmg: w.dmg, color: p.color
          });
        }
      }
    }

    function update() {
      if (!inGame) return;

      if (isHost) {
        handleInput(myPlayerId, keys);

        // AI BOT Sederhana
        if (gameState.players[99] && gameState.players[99].hp > 0) {
          let bot = gameState.players[99];
          let player = gameState.players[myPlayerId];
          if (player) {
            let angle = Math.atan2(player.y - bot.y, player.x - bot.x);
            bot.x += Math.cos(angle) * bot.spd;
            bot.y += Math.sin(angle) * bot.spd;
            bot.dirX = Math.cos(angle) > 0 ? 1 : -1;
            bot.animTick += 0.1;

            if (Math.hypot(player.x - bot.x, player.y - bot.y) < 40 && Date.now() > bot.lastAtt) {
              bot.lastAtt = Date.now() + 800;
              player.hp -= 10;
              sound.hit();
            }
          }
        }

        // Proyektil
        for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
          let pr = gameState.projectiles[i];
          pr.x += pr.vx; pr.y += pr.vy;
          for (let id in gameState.players) {
            if (id == pr.ownerId) continue;
            let target = gameState.players[id];
            if (target.hp > 0 && Math.hypot(pr.x - target.x, pr.y - target.y) < 20) {
              target.hp -= pr.dmg;
              if (target.hp <= 0 && pr.ownerId == myPlayerId) addCoins(150);
              gameState.projectiles.splice(i, 1);
              break;
            }
          }
        }

        if (networkChannel) sendNet({ type: "SYNC", state: gameState });
      } else {
        sendNet({ type: "INPUT", id: myPlayerId, keys: keys });
      }
    }

    // DRAW STICKMAN CHARACTER
    function drawStickman(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.strokeStyle = p.color;
      ctx.fillStyle = p.color;
      ctx.lineWidth = 3;

      let legAngle = Math.sin(p.animTick || 0) * 0.5;

      // 1. KEPALA
      ctx.beginPath();
      ctx.arc(0, -25, 8, 0, Math.PI * 2);
      ctx.stroke();

      // 2. BADAN
      ctx.beginPath();
      ctx.moveTo(0, -17);
      ctx.lineTo(0, 5);
      ctx.stroke();

      // 3. KAKI
      ctx.beginPath();
      ctx.moveTo(0, 5);
      ctx.lineTo(Math.sin(legAngle) * 12, 22);
      ctx.moveTo(0, 5);
      ctx.lineTo(Math.sin(-legAngle) * 12, 22);
      ctx.stroke();

      // 4. TANGAN & SENJATA
      ctx.beginPath();
      ctx.moveTo(0, -10);
      let armX = (p.dirX || 1) * 15;
      ctx.lineTo(armX, -5);
      ctx.stroke();

      // Visual Senjata Pedang/Tongkat
      ctx.strokeStyle = "#ffd700";
      ctx.beginPath();
      ctx.moveTo(armX, -5);
      ctx.lineTo(armX + (p.dirX || 1) * 15, -12);
      ctx.stroke();

      ctx.restore();

      // HP BAR
      ctx.fillStyle = "red"; ctx.fillRect(p.x - 20, p.y - 42, 40, 5);
      ctx.fillStyle = "#2cb67d"; ctx.fillRect(p.x - 20, p.y - 42, Math.max(0, (p.hp / p.maxHp) * 40), 5);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!inGame) return;

      // Draw Proyektil
      gameState.projectiles.forEach(pr => {
        ctx.fillStyle = pr.color;
        ctx.beginPath(); ctx.arc(pr.x, pr.y, 5, 0, Math.PI * 2); ctx.fill();
      });

      // Draw Stickman Players
      for (let id in gameState.players) {
        let p = gameState.players[id];
        if (p.hp > 0) drawStickman(p);
      }
    }

    let loopStarted = false;
    function startGameLoop() {
      if (loopStarted) return;
      loopStarted = true;
      setInterval(() => { update(); draw(); }, 1000 / 60);
    }

    updateLoadoutUI();
  </script>
</body>
</html>
